<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet Notes Assistant</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f7fb;color:#152033}.shell{max-width:1120px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:28px}.hint{color:#5c6575}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:24px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:18px;box-shadow:0 3px 12px #15203308}.meeting{width:100%;text-align:left;border:0;border-bottom:1px solid #eef0f4;background:#fff;color:#152033;padding:14px 4px;cursor:pointer}.meeting:hover{background:#f7f9ff}.badge{font-size:12px;border-radius:10px;padding:3px 8px;background:#edf1ff;color:#354ca8}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{border:0;border-radius:8px;padding:9px 12px;background:#2947d3;color:#fff;font-weight:600;cursor:pointer;text-decoration:none}button.secondary{background:#edf0f6;color:#253044}button.danger{background:#b3261e}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d9deea;border-radius:8px;margin:12px 0}section{margin-top:22px}ul{padding-left:20px}.transcript{white-space:pre-wrap;line-height:1.55;max-height:450px;overflow:auto;background:#f7f8fb;padding:14px;border-radius:8px}.empty{padding:40px 0;text-align:center;color:#667085}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header><div><h1>Meet Notes Assistant</h1><p class="hint">Private, post-meeting reports for Google Meet.</p></div><div style="text-align:right"><span id="health" class="badge">Checking service…</span><br><a id="microsoft-connect" href="/api/microsoft/connect" class="hint" style="display:none;margin-top:4px">Connect Microsoft 365</a></div></header><div class="grid"><aside class="card"><input id="search" placeholder="Search meetings, people, topics"><div id="meeting-list"></div></aside><article id="detail" class="card"><div class="empty">Select a meeting to view its report.</div></article></div><datalist id="known-speaker-names"></datalist></main><script type="module">
import { processingStatusText } from './dashboard-status.js';
const list=document.querySelector('#meeting-list'),detail=document.querySelector('#detail'),search=document.querySelector('#search');let selected;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
const stageMessage=processingStatusText;
const bestReport=m=>m.finalReport??m.provisionalReport??m.report;
const bestTranscript=m=>m.finalTranscript?.length?m.finalTranscript:m.provisionalTranscript?.length?m.provisionalTranscript:m.transcript||[];
async function load(){const meetings=await api('/api/meetings?q='+encodeURIComponent(search.value));list.innerHTML=meetings.length?meetings.map(m=>`<button class="meeting" data-id="${m.id}"><strong>${new Date(m.createdAt).toLocaleString()}</strong><br><span class="badge">${esc(stageMessage(m))}</span> <span class="hint">${esc(m.language)}</span></button>`).join(''):'<p class="hint">No meetings yet. Start one from the extension.</p>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));}
async function open(id){selected=await api('/api/meetings/'+id);render();}
function render(){const m=selected;if(!m)return;const r=bestReport(m),transcript=bestTranscript(m),isInitial=!m.finalReport&&Boolean(m.provisionalReport),notice=stageMessage(m),problem=m.error||(m.finalError?`The speaker report could not finish: ${m.finalError}`:'');detail.innerHTML=`<div class="actions"><span class="badge">${esc(notice)}</span><button class="secondary" id="refresh">Refresh</button>${m.status==='recording'?'<button id="finish-now">Finish recording now</button>':''}${(m.status==='failed'||m.finalError)?'<button id="retry">Retry processing</button>':''}${r?`<a class="button" href="/api/meetings/${m.id}/download">Download report</a><button id="export-doc">Export to Google Docs</button><button class="secondary" id="rename-speakers">Rename speakers</button>`:''}${m.googleDocUrl?`<a class="button" href="${esc(m.googleDocUrl)}" target="_blank">Open Google Doc</a>`:''}<button class="danger" id="delete">Delete meeting</button></div>${problem?`<p style="color:#b3261e">${esc(problem)}</p>`:''}${m.forcedFinish?`<p style="padding:10px 12px;background:#fff0e0;border-radius:8px">This recording was finished ${m.forcedFinish==='manual'?'manually':'automatically after a long period of inactivity'} instead of by the extension detecting the meeting ended. If the meeting was still going, this report may be missing whatever happened afterward.</p>`:''}${m.microsoftExportError?`<p class="hint" style="padding:10px 12px;background:#f7f8fb;border-radius:8px">Microsoft 365 export did not finish: ${esc(m.microsoftExportError)}</p>`:''}${!r?`<div class="empty">${esc(notice)} Refresh in a moment.</div>`:`${isInitial?'<p class="hint" style="padding:10px 12px;background:#fff7df;border-radius:8px">Initial notes are ready. Names and speaker times will appear after the final speaker-analysis pass.</p>':''}<div id="rename-form" style="display:none;padding:12px;background:#f7f8fb;border-radius:8px;margin-bottom:12px">${r.speakerStats.map(x=>`<label style="display:block;margin-top:8px">${esc(x.speakerLabel)}<input list="known-speaker-names" data-old="${esc(x.speakerLabel)}" placeholder="${esc(x.speakerLabel)}"></label>`).join('')}<div class="actions" style="margin-top:10px"><button id="save-speaker-names">Save names</button><button class="secondary" id="cancel-rename">Cancel</button></div></div><section><h2>Summary</h2><p>${esc(r.summary)}</p></section><section><h2>Decisions</h2><ul>${r.decisions.map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>None stated</li>'}</ul></section><section><h2>Action items</h2><ul>${r.actionItems.map(x=>'<li>'+esc(x.text)+(x.ownerSpeakerLabel?' — '+esc(x.ownerSpeakerLabel):'')+(x.dueDate?' (due '+esc(x.dueDate)+')':'')+'</li>').join('')||'<li>None stated</li>'}</ul></section><section><h2>${isInitial?'Speaker labels':'Speaker report'}</h2><ul>${r.speakerStats.map(x=>'<li>'+esc(x.speakerLabel)+': '+Math.round(x.talkSeconds)+' seconds</li>').join('')}</ul></section><section><h2>Transcript</h2><div class="transcript">${transcript.map(x=>esc(x.speakerLabel)+' ['+esc(new Date(new Date(m.createdAt).getTime()+Math.max(0,x.startSeconds)*1000).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'medium'}))+'] '+esc(x.text)).join('\n\n')}</div></section>`}`;document.querySelector('#refresh').onclick=()=>open(m.id);document.querySelector('#finish-now')?.addEventListener('click',async()=>{if(!confirm('This ends the recording right now and builds the report from whatever was captured so far. Only do this if the recording is stuck (for example, the browser crashed) and will not finish on its own — if the meeting is still going, wait for it to end normally instead. Continue?'))return;try{await api('/api/meetings/'+m.id+'/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({manual:true})});await open(m.id);load()}catch(error){alert(error.message)}});document.querySelector('#retry')?.addEventListener('click',async()=>{try{await api('/api/meetings/'+m.id+'/retry',{method:'POST'});await open(m.id);load()}catch(error){alert(error.message)}});document.querySelector('#delete').onclick=async()=>{if(confirm('Delete this meeting and its recording?')){await api('/api/meetings/'+m.id,{method:'DELETE'});selected=null;detail.innerHTML='<div class="empty">Meeting deleted.</div>';load()}};document.querySelector('#export-doc')?.addEventListener('click',async()=>{try{const result=await api('/api/meetings/'+m.id+'/export/google-doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'new'})});window.open(result.url,'_blank');open(m.id)}catch(error){if(confirm('Google Docs needs to be connected. Open the Google sign-in page now?'))location.href='/api/google/connect';else alert(error.message)}});const renameForm=document.querySelector('#rename-form');document.querySelector('#rename-speakers')?.addEventListener('click',()=>{if(renameForm)renameForm.style.display='block'});document.querySelector('#cancel-rename')?.addEventListener('click',()=>{if(renameForm)renameForm.style.display='none'});document.querySelector('#save-speaker-names')?.addEventListener('click',async()=>{const labels={};renameForm?.querySelectorAll('input[data-old]').forEach(input=>{const value=input.value.trim();if(value)labels[input.dataset.old]=value});if(!Object.keys(labels).length){if(renameForm)renameForm.style.display='none';return}try{await api('/api/meetings/'+m.id+'/speakers',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({labels})});await loadKnownSpeakers();await open(m.id)}catch(error){alert(error.message)}})}
search.oninput=()=>load();
async function loadKnownSpeakers(){const names=await api('/api/known-speakers').catch(()=>[]);document.querySelector('#known-speaker-names').innerHTML=names.map(name=>`<option value="${esc(name)}">`).join('')}
async function refreshHealth(){const health=document.querySelector('#health');try{const h=await fetch('/api/health').then(r=>r.json());health.textContent=!h.openAiConfigured?'Add OPENAI_API_KEY':h.ffmpegAvailable===false?'Install FFmpeg for speaker reports':'OpenAI connected';health.style.cursor=h.openAiConfigured?'default':'pointer';health.onclick=h.openAiConfigured?null:async()=>{const key=prompt('Paste your OpenAI API key (from platform.openai.com/api-keys)');if(!key)return;try{await api('/api/settings/openai-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:key})});refreshHealth()}catch(error){alert(error.message)}};if(h.microsoftConfigured)document.querySelector('#microsoft-connect').style.display='inline'}catch{health.textContent='Server unavailable'}}
refreshHealth();
load();
loadKnownSpeakers();
</script></body></html>
