<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet Notes Assistant</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f7fb;color:#152033}.shell{max-width:1120px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:28px}.hint{color:#5c6575}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:24px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:18px;box-shadow:0 3px 12px #15203308}.meeting{width:100%;text-align:left;border:0;border-bottom:1px solid #eef0f4;background:#fff;padding:14px 4px;cursor:pointer}.meeting:hover{background:#f7f9ff}.badge{font-size:12px;border-radius:10px;padding:3px 8px;background:#edf1ff;color:#354ca8}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{border:0;border-radius:8px;padding:9px 12px;background:#2947d3;color:#fff;font-weight:600;cursor:pointer;text-decoration:none}button.secondary{background:#edf0f6;color:#253044}button.danger{background:#b3261e}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d9deea;border-radius:8px;margin:12px 0}section{margin-top:22px}ul{padding-left:20px}.transcript{white-space:pre-wrap;line-height:1.55;max-height:450px;overflow:auto;background:#f7f8fb;padding:14px;border-radius:8px}.empty{padding:40px 0;text-align:center;color:#667085}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header><div><h1>Meet Notes Assistant</h1><p class="hint">Private, post-meeting reports for Google Meet.</p></div><span id="health" class="badge">Checking service…</span></header><div class="grid"><aside class="card"><input id="search" placeholder="Search meetings, people, topics"><div id="meeting-list"></div></aside><article id="detail" class="card"><div class="empty">Select a meeting to view its report.</div></article></div></main><script>
const list=document.querySelector('#meeting-list'),detail=document.querySelector('#detail'),search=document.querySelector('#search');let selected;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options){const r=await fetch(path,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function load(){const meetings=await api('/api/meetings?q='+encodeURIComponent(search.value));list.innerHTML=meetings.length?meetings.map(m=>`<button class="meeting" data-id="${m.id}"><strong>${new Date(m.createdAt).toLocaleString()}</strong><br><span class="badge">${m.status}</span> <span class="hint">${m.language}</span></button>`).join(''):'<p class="hint">No meetings yet. Start one from the extension.</p>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openMeeting(b.dataset.id));}
async function openMeeting(id){selected=await api('/api/meetings/'+id);render();}
function render(){const m=selected;if(!m)return;const r=m.report;detail.innerHTML=`<div class="actions"><span class="badge">${esc(m.status)}</span><button class="secondary" id="refresh">Refresh</button>${r?`<a class="button" href="/api/meetings/${m.id}/download">Download report</a><button id="export-doc">Export to Google Docs</button>`:''}${m.googleDocUrl?`<a class="button" href="${esc(m.googleDocUrl)}" target="_blank">Open Google Doc</a>`:''}<button class="danger" id="delete">Delete meeting</button></div>${m.error?`<p style="color:#b3261e">${esc(m.error)}</p>`:''}${!r?'<div class="empty">Processing will appear here automatically. Refresh in a moment.</div>':`<section><h2>Summary</h2><p>${esc(r.summary)}</p></section><section><h2>Decisions</h2><ul>${r.decisions.map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>None stated</li>'}</ul></section><section><h2>Action items</h2><ul>${r.actionItems.map(x=>'<li>'+esc(x.text)+(x.ownerSpeakerLabel?' — '+esc(x.ownerSpeakerLabel):'')+(x.dueDate?' (due '+esc(x.dueDate)+')':'')+'</li>').join('')||'<li>None stated</li>'}</ul></section><section><h2>Speaker report</h2><ul>${r.speakerStats.map(x=>'<li>'+esc(x.speakerLabel)+': '+Math.round(x.talkSeconds)+' seconds</li>').join('')}</ul></section><section><h2>Transcript</h2><div class="transcript">${m.transcript.map(x=>esc(x.speakerLabel)+' ['+Math.floor(x.startSeconds/60).toString().padStart(2,'0')+':'+Math.floor(x.startSeconds%60).toString().padStart(2,'0')+'] '+esc(x.text)).join('\n\n')}</div></section>`}`;document.querySelector('#refresh').onclick=()=>openMeeting(m.id);document.querySelector('#delete').onclick=async()=>{if(confirm('Delete this meeting and its recording?')){await api('/api/meetings/'+m.id,{method:'DELETE'});selected=null;detail.innerHTML='<div class="empty">Meeting deleted.</div>';load()}};document.querySelector('#export-doc')?.addEventListener('click',async()=>{try{const result=await api('/api/meetings/'+m.id+'/export/google-doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'new'})});window.open(result.url,'_blank');openMeeting(m.id)}catch(error){if(confirm('Google Docs needs to be connected. Open the Google sign-in page now?'))location.href='/api/google/connect';else alert(error.message)}})}
search.oninput=()=>load();fetch('/api/health').then(r=>r.json()).then(h=>document.querySelector('#health').textContent=h.openAiConfigured?'OpenAI connected':'Add OPENAI_API_KEY').catch(()=>document.querySelector('#health').textContent='Server unavailable');load();
</script></body></html>
