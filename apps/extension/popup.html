<!doctype html><html><head><meta charset="utf-8"><title>Meet Notes Assistant</title><style>body{width:280px;margin:0;padding:16px;font:14px system-ui,sans-serif;color:#172033}h1{font-size:16px;margin:0 0 8px}label,select,button{display:block;width:100%}select,button{box-sizing:border-box;margin-top:6px;padding:9px;border-radius:7px}select{border:1px solid #cbd2e1}button{border:0;background:#2947d3;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55}p{color:#5d6678;line-height:1.35}</style></head><body><h1>Meet Notes Assistant</h1><p>Confirm that everyone knows the meeting is being recorded.</p><label>Meeting language<select id="language"><option value="auto">Auto-detect</option><option value="hi-en">Hindi / Hinglish</option><option value="mr-en">Marathi / Marathi-English</option><option value="en">English</option></select></label><button id="start">Start recording</button><p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
